<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PenthiusX — Globe Pulse</title>
  <desc id="desc">A modern premium banner with a futuristic globe pulse aesthetic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060A12"/>
      <stop offset="0.45" stop-color="#10182B"/>
      <stop offset="1" stop-color="#0A1A2A"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="180" y1="60" x2="760" y2="300" gradientUnits="userSpaceOnUse">
