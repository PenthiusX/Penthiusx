      <stop offset="0.5" stop-color="#4E78FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4E78FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
