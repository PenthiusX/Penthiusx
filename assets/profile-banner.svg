      <stop offset="0.55" stop-color="#5FA9FF"/>
      <stop offset="1" stop-color="#D18BFF"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1280 190) rotate(90) scale(210)">
